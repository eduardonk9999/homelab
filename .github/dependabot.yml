# Mantém imagens base e actions (fixadas por SHA) atualizadas via PR semanal.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/homepage
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories:
      - /apps/vuln-lab
    schedule:
      interval: weekly
