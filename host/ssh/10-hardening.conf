# /etc/ssh/sshd_config.d/10-hardening.conf
# O sshd usa o PRIMEIRO valor encontrado de cada opção. Como os arquivos de sshd_config.d
# são lidos em ordem alfabética, o prefixo 10- vence o 50-cloud-init.conf (que pode
# ligar PasswordAuthentication).

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers duzera

MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
